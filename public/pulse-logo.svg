<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Pulse">
  <!-- Pulse logo badge: same red gradient, italic P and pink dot as the header logo (.pulse-logo-badge) -->
  <defs>
    <linearGradient id="pulse-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="6" width="54" height="54" rx="15" fill="url(#pulse-badge)"/>
  <text x="29" y="46" text-anchor="middle" fill="#fff" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" font-style="italic">P</text>
  <circle cx="53" cy="10" r="7" fill="#fda4af" stroke="#fff" stroke-width="3"/>
</svg>
